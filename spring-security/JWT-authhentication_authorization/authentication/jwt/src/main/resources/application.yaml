spring:
  application:
    name: basicAuthDemo
  datasource:
    url: jdbc:mysql://localhost:3306/basic_auth
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
server:
  port: 8080